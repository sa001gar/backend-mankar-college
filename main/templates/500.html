{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>500 - Internal Server Error</title>
    <link rel="icon" type="image/png" href="https://media.computersciencemancoll.in/media/images/logo.jpeg">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Internal Server Error">
    <meta name="author" content="Sagar Kundu">
    <meta name="keywords" content="500, server error, internal error">
    <meta name="robots" content="noindex, nofollow">
    
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap');

        :root {
            --primary-color: #4a4e69;
            --secondary-color: #22223b;
            --accent-color: #9a8c98;
            --text-color: #f2e9e4;
            --background-color: #22223b;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
            width: 100%;
            overflow: hidden;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--background-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            text-align: center;
            background-color: var(--secondary-color);
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 15px 30px rgba(0,0,0,0.3);
            max-width: 600px;
            width: 95%;
            max-height: 90vh;
            overflow-y: auto;
            border: 1px solid var(--accent-color);
        }

        .error-image {
            max-width: 250px;
            max-height: 250px;
            height: auto;
            margin-bottom: 20px;
            object-fit: contain;
        }

        .error-code {
            font-size: 100px;
            font-weight: 800;
            color: var(--accent-color);
            margin-bottom: 10px;
            line-height: 1;
        }

        .error-message {
            font-size: 28px;
            font-weight: 600;
            margin-bottom: 20px;
            color: var(--text-color);
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .error-description {
            font-size: 16px;
            color: rgba(242, 233, 228, 0.8);
            margin-bottom: 30px;
            line-height: 1.6;
        }

        .developer-info {
            background-color: var(--primary-color);
            border-radius: 15px;
            padding: 25px;
            margin-top: 30px;
        }

        .developer-info h3 {
            color: var(--text-color);
            margin-bottom: 20px;
            font-size: 20px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .contact-details {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin-top: 15px;
            flex-wrap: wrap;
        }

        .contact-details a {
            color: var(--text-color);
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: all 0.3s ease;
            font-size: 16px;
            opacity: 0.8;
        }

        .contact-details a:hover {
            opacity: 1;
            color: var(--accent-color);
        }

        .contact-details i {
            font-size: 20px;
        }

        @media (max-width: 480px) {
            .container {
                padding: 20px;
                width: 100%;
            }

            .error-code {
                font-size: 70px;
            }

            .error-message {
                font-size: 20px;
            }

            .contact-details {
                flex-direction: column;
                align-items: center;
                gap: 15px;
            }
        }

        /* Scrollbar styling */
        .container::-webkit-scrollbar {
            width: 8px;
        }

        .container::-webkit-scrollbar-track {
            background: var(--primary-color);
            border-radius: 10px;
        }

        .container::-webkit-scrollbar-thumb {
            background-color: var(--accent-color);
            border-radius: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <img src="https://img.freepik.com/premium-vector/500-internal-server-error_773186-1175.jpg?w=826" alt="Server Error Illustration" class="error-image" />
        
        <div class="error-code">500</div>
        <h1 class="error-message">Internal Server Error</h1>
        <p class="error-description">
            We're experiencing a temporary technical issue. Our team has been notified and is working to resolve it quickly.
        </p>

        <div class="developer-info">
            <h3>Need Assistance?</h3>
            <div class="contact-details">
                <a href="mailto:developer@computersciencemancoll.in">
                    <i class="fas fa-envelope"></i> Email
                </a>
                <a href="https://wa.me/917699876839" target="_blank">
                  <i class="fab fa-whatsapp"></i> WhatsApp
                </a>
                <a href="https://github.com/sa001gar" target="_blank">
                    <i class="fab fa-github"></i> GitHub
                </a>
            </div>
        </div>
    </div>
</body>
</html>
